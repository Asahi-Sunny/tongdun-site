<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>童盾智伴 - 家长学习报告</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="report-body">
    <main class="report-shell">
      <section class="report-page standalone-report" aria-label="家长学习报告">
        <header class="report-hero">
          <div>
            <span class="eyebrow">家长模式</span>
            <h1>学习报告</h1>
            <p id="reportOverviewText">正在生成孩子的训练表现。</p>
          </div>
          <div class="report-actions">
            <button class="secondary-button" type="button" id="resetReportBtn">一键重测</button>
            <a class="secondary-button report-back" href="index.html">返回训练</a>
          </div>
        </header>

        <section class="score-strip" aria-label="报告关键指标">
          <article class="score-card" id="totalScoreCard">
            <span>综合得分</span>
            <strong id="reportScore">0</strong>
            <small>满分 100 分</small>
          </article>
          <article class="score-card" id="completeCard">
            <span>完成场景</span>
            <strong id="completedCount">0/5</strong>
            <small>剧情训练记录</small>
          </article>
          <article class="score-card" id="strongCard">
            <span>优势维度</span>
            <strong id="strongestDimension">待生成</strong>
            <small>表现较稳定</small>
          </article>
          <article class="score-card" id="weakCard">
            <span>加强维度</span>
            <strong id="weakestDimension">待生成</strong>
            <small>建议家庭陪伴</small>
          </article>
        </section>

        <div class="report-grid">
          <article class="report-card">
            <div class="report-card-head">
              <div>
                <span class="eyebrow">能力画像</span>
                <h3>五维综合雷达</h3>
              </div>
            </div>
            <canvas id="reportRadarCanvas" width="460" height="360" aria-label="家长报告五维雷达图"></canvas>
          </article>

          <article class="report-card">
            <div class="report-card-head">
              <div>
                <span class="eyebrow">维度明细</span>
                <h3>每项 100 分</h3>
              </div>
            </div>
            <div class="dimension-bars" id="reportDimensionBars"></div>
          </article>

          <article class="report-card report-wide">
            <div class="report-card-head">
              <div>
                <span class="eyebrow">场景记录</span>
                <h3>回答表现</h3>
              </div>
            </div>
            <div class="scenario-report-list" id="scenarioReports"></div>
          </article>

          <article class="report-card report-wide">
            <div class="report-card-head">
              <div>
                <span class="eyebrow">家庭建议</span>
                <h3>下一步陪伴重点</h3>
              </div>
            </div>
            <div class="family-actions" id="familyActions"></div>
          </article>
        </div>
      </section>
    </main>

    <script src="report.js"></script>
  </body>
</html>
